name: nonce-card regression

on:
  push:
    branches: ["fix/mcp-send-nonce-card"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: node --test test/household-send-nonce-card.test.mjs
