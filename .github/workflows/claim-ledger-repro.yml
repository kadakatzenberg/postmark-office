name: Claim ledger repair verification

on:
  push:
    branches:
      - investigate/claim-ledger-flake

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: investigate/claim-ledger-flake
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make claim-ledger own its listener ports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("test/claim-ledger.test.mjs")
          text = path.read_text()
          old_marker = "const PORT = 43901;\nconst GH_PORT = 43902;\nconst BASE = `http://127.0.0.1:${PORT}`;"
          marker_lines = [
              "// Both listeners belong to this test process. Asking the kernel for their ports",
              "// means another lane can run the same file on the same box without becoming",
              "// shared state for this one.",
              "let BASE;",
          ]
          new_marker = "\n".join(marker_lines)
          gh_listen = "\n".join([
              "  let ghBase;",
              "  await new Promise((ok, no) => {",
              "    const fail = (error) => no(error);",
              "    ghServer.once(\"error\", fail);",
              "    ghServer.listen(0, \"127.0.0.1\", () => {",
              "      ghServer.off(\"error\", fail);",
              "      ghBase = `http://127.0.0.1:${ghServer.address().port}`;",
              "      ok();",
              "    });",
              "  });",
          ])
          office_ready = "\n".join([
              "  let officePort = null;",
              "  child.stdout.on(\"data\", (data) => {",
              "    const match = /listening on :(\\d+)/.exec(String(data));",
              "    if (match) officePort = Number(match[1]);",
              "  });",
              "  await awaitListening(child);",
              "  assert.ok(officePort, \"the office announces its kernel-assigned port\");",
              "  BASE = `http://127.0.0.1:${officePort}`;",
          ])

          if old_marker in text:
              replacements = [
                  (old_marker, new_marker),
                  ('const url = new URL(req.url, `http://127.0.0.1:${GH_PORT}`);', 'const url = new URL(req.url, "http://127.0.0.1");'),
                  ('  await new Promise((ok) => ghServer.listen(GH_PORT, ok));', gh_listen),
                  ('  child = spawn(process.execPath, [join(ROOT, "src", "server.mjs"), "--port", String(PORT),', '  child = spawn(process.execPath, [join(ROOT, "src", "server.mjs"), "--port", "0",'),
                  ('      GITHUB_AUTH_URL: `http://127.0.0.1:${GH_PORT}/login/oauth/authorize`,', '      GITHUB_AUTH_URL: `${ghBase}/login/oauth/authorize`,'),
                  ('      GITHUB_TOKEN_URL: `http://127.0.0.1:${GH_PORT}/login/oauth/access_token`,', '      GITHUB_TOKEN_URL: `${ghBase}/login/oauth/access_token`,'),
                  ('      GITHUB_API_URL: `http://127.0.0.1:${GH_PORT}`,', '      GITHUB_API_URL: ghBase,'),
                  ('  await awaitListening(child);', office_ready),
              ]
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"missing expected claim-ledger seam: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
          elif new_marker not in text:
              raise SystemExit("claim-ledger port seam is neither original nor repaired")
          PY
          git diff --check
      - name: Run claim ledger ten times serially
        shell: bash
        run: |
          failures=0
          : > claim-ledger-summary.txt
          for n in $(seq 1 10); do
            echo "=== serial run $n ===" | tee -a claim-ledger-summary.txt
            set +e
            node --test --test-timeout=180000 test/claim-ledger.test.mjs > "claim-ledger-$n.txt" 2>&1
            code=$?
            set -e
            echo "exit=$code" | tee -a claim-ledger-summary.txt
            grep '^# pass\|^# fail\|^not ok' "claim-ledger-$n.txt" | tee -a claim-ledger-summary.txt || true
            if [ "$code" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          echo "serial_failed_runs=$failures" | tee -a claim-ledger-summary.txt
          echo "$failures" > claim-ledger-serial-failures.txt
      - name: Run two copies concurrently
        shell: bash
        run: |
          set +e
          node --test --test-timeout=180000 test/claim-ledger.test.mjs > claim-ledger-concurrent-a.txt 2>&1 &
          pid_a=$!
          node --test --test-timeout=180000 test/claim-ledger.test.mjs > claim-ledger-concurrent-b.txt 2>&1 &
          pid_b=$!
          wait "$pid_a"; code_a=$?
          wait "$pid_b"; code_b=$?
          set -e
          echo "=== concurrent A ===" | tee -a claim-ledger-summary.txt
          echo "exit=$code_a" | tee -a claim-ledger-summary.txt
          grep '^# pass\|^# fail\|^not ok' claim-ledger-concurrent-a.txt | tee -a claim-ledger-summary.txt || true
          echo "=== concurrent B ===" | tee -a claim-ledger-summary.txt
          echo "exit=$code_b" | tee -a claim-ledger-summary.txt
          grep '^# pass\|^# fail\|^not ok' claim-ledger-concurrent-b.txt | tee -a claim-ledger-summary.txt || true
          concurrent_failures=0
          if [ "$code_a" -ne 0 ]; then concurrent_failures=$((concurrent_failures + 1)); fi
          if [ "$code_b" -ne 0 ]; then concurrent_failures=$((concurrent_failures + 1)); fi
          echo "concurrent_failed_runs=$concurrent_failures" | tee -a claim-ledger-summary.txt
          echo "$concurrent_failures" > claim-ledger-concurrent-failures.txt
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: claim-ledger-owned-ports
          path: |
            claim-ledger-summary.txt
            claim-ledger-serial-failures.txt
            claim-ledger-concurrent-failures.txt
            claim-ledger-*.txt
      - name: Require clean serial and concurrent runs
        shell: bash
        run: |
          test "$(cat claim-ledger-serial-failures.txt)" -eq 0
          test "$(cat claim-ledger-concurrent-failures.txt)" -eq 0
      - name: Commit verified repair
        shell: bash
        run: |
          if git diff --quiet -- test/claim-ledger.test.mjs; then
            echo "source already committed"
            exit 0
          fi
          git config user.name "kadakatzenberg"
          git config user.email "131329396+kadakatzenberg@users.noreply.github.com"
          git add test/claim-ledger.test.mjs
          git commit -m "test: let claim-ledger own its listener ports"
          git push origin HEAD:investigate/claim-ledger-flake
