name: Branch test

on:
  push:
    branches:
      - fix/bouncer-server-clock

jobs:
  bouncer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test --test-timeout=180000 test/bouncer.test.mjs test/bouncer-server.test.mjs
