name: Finalize portable drain pen repair

on:
  push:
    branches: [finalize/drain-pen-portable]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Save verified helper
        run: cp test/helpers/drain-pen.mjs /tmp/drain-pen.mjs
      - name: Reset onto current upstream w39
        run: |
          git fetch https://github.com/keeminlee/postmark-office.git '+refs/heads/train/2026-w39:refs/remotes/upstream/train/2026-w39'
          test "$(git rev-parse refs/remotes/upstream/train/2026-w39)" = "2879fd11bf2996429de0d4937cc2a67ff68e778e"
          git reset --hard refs/remotes/upstream/train/2026-w39
          cp /tmp/drain-pen.mjs test/helpers/drain-pen.mjs
          git diff --check
          test "$(git diff --name-only)" = "test/helpers/drain-pen.mjs"
      - run: npm ci
      - name: town-bridge
        run: node --test test/town-bridge.test.mjs
      - name: town-journal
        run: node --test test/town-journal.test.mjs
      - name: gangway-drain
        run: node --test test/gangway-drain.test.mjs
      - name: paper-seam
        run: node --test test/paper-seam.test.mjs
      - name: deferral-tripwire
        run: node --test test/deferral-tripwire.test.mjs
      - name: drain-idempotence
        run: node --test test/drain-idempotence.test.mjs
      - name: Publish one clean commit
        run: |
          git config user.name "kadakatzenberg"
          git config user.email "131329396+kadakatzenberg@users.noreply.github.com"
          git add test/helpers/drain-pen.mjs
          git commit -m "test: make drain pen fixture portable"
          git push --force-with-lease=refs/heads/fix/drain-pen-portable-engine:1c80814816bf08786723cbbea7ede2a870d8d881 origin HEAD:refs/heads/fix/drain-pen-portable-engine
