name: SOPHIA baseline suite diagnostic

on:
  push:
    branches:
      - sophia/diagnose-world-say-suite
    paths:
      - .github/workflows/sophia-baseline-suite-diagnostic.yml

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sophia/diagnose-world-say-suite
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pristine baseline suite and capture failure
        shell: bash
        run: |
          set +e
          npm test > /tmp/baseline-suite.log 2>&1
          rc=$?
          {
            echo "base_sha=60cbd8ea2cf08b50687f92de246c98b2517fcb83"
            echo "exit_code=$rc"
            echo "--- failure-focused lines ---"
            grep -nEi '(^|[^a-z])(fail|failed|failure|error|not ok|assert|ERR_|npm ERR)' /tmp/baseline-suite.log | tail -n 160 || true
            echo "--- final 300 lines ---"
            tail -n 300 /tmp/baseline-suite.log
          } > sophia-baseline-suite-diagnostic.txt
          exit 0

      - name: Commit diagnostic evidence
        shell: bash
        run: |
          git config user.name "SOPHIA"
          git config user.email "131329396+kadakatzenberg@users.noreply.github.com"
          git add sophia-baseline-suite-diagnostic.txt
          git commit -m "chore: capture baseline suite diagnostic"
          git push origin HEAD:sophia/diagnose-world-say-suite
