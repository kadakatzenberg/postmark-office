name: Patch #2690 pre-arrival occupancy

on:
  push:
    branches:
      - fix/2690-prearrival-occupancy
    paths:
      - .github/workflows/patch-2690.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Write regression falsifier
        shell: bash
        run: |
          cat > test/dec5-walk-clock.test.mjs <<'EOF'
          // #2690 — a scheduled enter_on_arrival must not become occupancy before arrival.
          //
          // The DEC-5 walk guard and the explicit enter/exit door read the same passage
          // ledger. The guard therefore has to ask that ledger at the town's fractional
          // crossing clock, not at Unix half-days. The original defect used
          // Date.now() / 43200000 here, making a future crossing (~185) look older than
          // an absolute Unix half-day count (~41k) and producing phantom occupancy.

          import test from "node:test";
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const source = readFileSync(new URL("../src/world.mjs", import.meta.url), "utf8");

          test("#2690 — the DEC-5 occupancy guard uses the same town clock dependency as enter/exit", () => {
            const start = source.indexOf("DEC-5, THE WALK GUARD");
            assert.notEqual(start, -1, "the DEC-5 guard still exists");
            const guard = source.slice(start, start + 5000);

            assert.match(guard, /const deps = crossingDeps\(\);/,
              "the guard obtains the enter/exit door's dependency set");
            assert.match(guard, /const atNow = law\.thresholds\.stampAt\(deps\.now\(\)\);/,
              "occupancy is evaluated at the town's fractional crossing clock");
            assert.doesNotMatch(guard, /Date\.now\(\)\s*\/\s*43200000/,
              "Unix half-days are not the ferry clock and would make future arrivals look current");
          });
          EOF

      - name: Verify regression is red before the fix
        shell: bash
        run: |
          set +e
          node --test test/dec5-walk-clock.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Regression test unexpectedly passed before the fix"
            exit 1
          fi
          echo "RED confirmed: #2690 is caught before the source change"

      - name: Apply minimal clock fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/world.mjs")
          text = path.read_text()
          old = "const atNow = law.thresholds.stampAt(Date.now() / 43200000);"
          new = "const atNow = law.thresholds.stampAt(deps.now());"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one #2690 clock expression, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify focused tests are green
        shell: bash
        run: |
          node --test test/dec5-walk-clock.test.mjs test/dec5-walk-guard.test.mjs

      - name: Commit fix and falsifier
        shell: bash
        run: |
          git config user.name "Sophia Familiaris"
          git config user.email "sophia-familiaris@users.noreply.github.com"
          git add src/world.mjs test/dec5-walk-clock.test.mjs
          git commit -m "fix(world): use town clock for walk occupancy guard"
          git push origin HEAD:${{ github.ref_name }}
