name: Patch #2712 moving child threshold

on:
  push:
    branches:
      - fix/2712-moving-child-threshold
    paths:
      - .github/workflows/patch-2712.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Write #2712 regression tests
        shell: bash
        run: |
          cat > test/moving-child-threshold.test.mjs <<'EOF'
          // #2712 — a threshold nested in a carrier moves with that carrier.
          // The resident standpoint already composes through the carrier frame; the
          // threshold reach must compose through the same frame before measuring.

          import test from "node:test";
          import assert from "node:assert/strict";
          import { mkdirSync, mkdtempSync, rmSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { tmpdir } from "node:os";
          import { enterViaOffice } from "../src/world-crossings.mjs";

          const WHO = "sophia-familiaris";
          const SHIP_ID = "the-town/the-post-office";
          const key = { handles: new Set([WHO]) };

          function fakeLawClone() {
            const dir = mkdtempSync(join(tmpdir(), "postmark-2712-"));
            mkdirSync(join(dir, "tools"), { recursive: true });
            writeFileSync(join(dir, "tools", "enter-exit.mjs"), `
              export const stampAt = (x) => x;
              export const parseEnterExitLedger = () => ({ acts: [] });
              export const occupancyAt = () => new Map([["${WHO}", ["${SHIP_ID}"]]]);
            `);
            writeFileSync(join(dir, "tools", "world-verbs.mjs"), `
              function pointInBox(pos, mark) {
                if (Array.isArray(mark?.points) && mark.points.length >= 3) {
                  const pts = mark.points.map((p) => Array.isArray(p) ? { x: p[0], y: p[1] } : p);
                  const xs = pts.map((p) => Number(p.x)), ys = pts.map((p) => Number(p.y));
                  return Number(pos?.x) >= Math.min(...xs) && Number(pos?.x) <= Math.max(...xs)
                    && Number(pos?.y) >= Math.min(...ys) && Number(pos?.y) <= Math.max(...ys);
                }
                const x = Number(mark?.at?.x), y = Number(mark?.at?.y);
                const w = Number(mark?.extent?.w), h = Number(mark?.extent?.h);
                return Number(pos?.x) >= x - w / 2 && Number(pos?.x) <= x + w / 2
                  && Number(pos?.y) >= y - h / 2 && Number(pos?.y) <= y + h / 2;
              }
              export const pointWithinMark = pointInBox;
              export function enter(state, targetId, world, { occupancy, handle }) {
                const target = world.marks.find((m) => m.id === targetId);
                if (!target) return { error: "missing target" };
                const chain = ["${SHIP_ID}", targetId];
                const held = occupancy.get(handle) ?? [];
                const links = chain.filter((id) => !held.includes(id));
                const standing = pointInBox(state, target);
                return {
                  target: targetId, chain, links, held,
                  walk: standing || !links.length ? null : { to: { ...target.at }, mark: targetId },
                  crossings: links.map((id) => ({ mark: id, effect: "entered", terms: [] })),
                  rows: links.map((id) => handle + " enters " + id),
                  entered: links, within: [...held, ...links],
                  stranded: null, refused: null, awaiting: null,
                };
              }
            `);
            return { dir, cleanup: () => rmSync(dir, { recursive: true, force: true }) };
          }

          function deps(world, here) {
            return {
              world: async () => world,
              ledger: async () => "",
              standpointOf: async () => ({ ...here, name: WHO }),
              now: () => 185,
              record: async ({ lines }) => ({
                lines, within: [SHIP_ID, lines.at(-1)?.split(" ").at(-1)].filter(Boolean),
                commit: "fixture", pushed: false,
              }),
            };
          }

          test("#2712 — an aboard resident can enter a child threshold at the carrier's live position", async (t) => {
            const c = fakeLawClone(); t.after(c.cleanup);
            const ship = { id: SHIP_ID, kind: "sited", at: { x: 0, y: 0 }, extent: { w: 10, h: 26 } };
            const wheelhouse = { id: "the-town/the-wheelhouse", kind: "sited", at: { x: 0, y: 1 }, extent: { w: 4, h: 2 } };
            const world = { marks: [ship, wheelhouse] };
            // Carrier origin is now (1800, 400); Sophia stands at the wheelhouse's
            // canonical +1 m y offset inside that moving frame.
            const here = { x: 1800, y: 401, aboard: true, frame: SHIP_ID, frame_offset: { x: 0, y: 1 }, moving: false };
            const answer = await enterViaOffice(c.dir, { mark: wheelhouse.id, handle: WHO }, key, deps(world, here));
            assert.deepEqual(answer.entered, [wheelhouse.id]);
            assert.equal(answer.walk_bundled, undefined, "no stale walk back to the canonical quay is returned after a live-frame admission");
          });

          test("#2712 — irregular child geometry is translated with its carrier, not just its anchor", async (t) => {
            const c = fakeLawClone(); t.after(c.cleanup);
            const ship = { id: SHIP_ID, kind: "sited", at: { x: 0, y: 0 }, extent: { w: 400, h: 400 } };
            const gallery = {
              id: "the-town/the-gallery", kind: "sited", at: { x: 0, y: 0 }, extent: { w: 200, h: 200 },
              points: [[-100, -100], [100, -100], [100, 100], [-100, 100]],
            };
            const world = { marks: [ship, gallery] };
            // 80 m from the translated anchor: outside the 60 m reach margin but
            // inside the translated polygon. Moving only `at` would still refuse.
            const here = { x: 1080, y: 1000, aboard: true, frame: SHIP_ID, frame_offset: { x: 80, y: 0 }, moving: false };
            const answer = await enterViaOffice(c.dir, { mark: gallery.id, handle: WHO }, key, deps(world, here));
            assert.deepEqual(answer.entered, [gallery.id]);
          });

          test("#2712 — a real refusal points at the child's live-frame coordinates", async (t) => {
            const c = fakeLawClone(); t.after(c.cleanup);
            const ship = { id: SHIP_ID, kind: "sited", at: { x: 0, y: 0 }, extent: { w: 500, h: 500 } };
            const farDoor = { id: "the-town/the-far-door", kind: "sited", at: { x: 150, y: 0 }, extent: { w: 2, h: 2 } };
            const world = { marks: [ship, farDoor] };
            const here = { x: 1000, y: 1000, aboard: true, frame: SHIP_ID, frame_offset: { x: 0, y: 0 }, moving: false };
            const e = await enterViaOffice(c.dir, { mark: farDoor.id, handle: WHO }, key, deps(world, here)).then(() => null, (err) => err);
            assert.equal(e?.code, 409);
            assert.deepEqual(e.walk?.to, { x: 1150, y: 1000 }, "the remedy follows the carrier instead of sending the resident to the stale canonical mark");
            assert.match(e.hint ?? "", /\(1150, 1000\)/);
          });
          EOF

      - name: Confirm the regression is red
        shell: bash
        run: |
          set +e
          node --test test/moving-child-threshold.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Regression unexpectedly passed before the #2712 fix"
            exit 1
          fi
          echo "RED confirmed: moving child thresholds are measured at stale world coordinates"

      - name: Apply frame-aware threshold composition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/world-crossings.mjs")
          text = path.read_text()

          needle = '''  return who;\n}\n\n/**\n * enter(mark) — the passage.\n'''
          helper = '''  return who;\n}\n\n// A mark nested in the carrier a resident is riding has the same frame as the\n// resident. The fold keeps mark geometry in canonical world coordinates while\n// `movementStandpoint` composes the resident into the carrier's live position.\n// Measure those two in one frame: translate the target by the carrier's live\n// displacement, but ONLY when the world engine's own threshold chain says that\n// carrier is an ancestor of the target. No pathname or second containment rule.\n//\n// `frame_offset` is the resident's local point in the carrier, so\n// `here - frame_offset` is the carrier's live anchor. Irregular marks carry\n// absolute polygon vertices, so the same translation must move `points` too.\nfunction thresholdAtStandpointFrame(target, plan, here, marks) {\n  if (!target?.at || here?.aboard !== true || here?.moving === true || !here?.frame\n      || !Array.isArray(plan?.chain) || !plan.chain.includes(here.frame)) return target;\n  const frame = (marks ?? []).find((m) => m.id === here.frame);\n  const nums = [here.x, here.y, here.frame_offset?.x, here.frame_offset?.y, frame?.at?.x, frame?.at?.y, target.at.x, target.at.y].map(Number);\n  if (!nums.every(Number.isFinite)) return target;\n  const [hx, hy, lx, ly, fx, fy, tx, ty] = nums;\n  const dx = (hx - lx) - fx, dy = (hy - ly) - fy;\n  if (dx === 0 && dy === 0) return target;\n  const moved = { ...target, at: { ...target.at, x: tx + dx, y: ty + dy } };\n  if (Array.isArray(target.points)) {\n    moved.points = target.points.map((p) => {\n      const array = Array.isArray(p);\n      const x = Number(array ? p[0] : p?.x), y = Number(array ? p[1] : p?.y);\n      if (!Number.isFinite(x) || !Number.isFinite(y)) return p;\n      return array ? [x + dx, y + dy] : { ...p, x: x + dx, y: y + dy };\n    });\n  }\n  return moved;\n}\n\n/**\n * enter(mark) — the passage.\n'''
          if text.count(needle) != 1:
              raise SystemExit(f"helper insertion point count: {text.count(needle)}")
          text = text.replace(needle, helper, 1)

          old = '''  const target = answer.links?.length\n    ? (w.marks ?? []).find((m) => m.id === (answer.target ?? markId)) ?? null\n    : null;\n  if (target && answer.walk) {\n    const reach = standsWithin(here, target, { pointWithinMark: verbs.pointWithinMark });\n    if (!reach.stands) {\n'''
          new = '''  const target = answer.links?.length\n    ? (w.marks ?? []).find((m) => m.id === (answer.target ?? markId)) ?? null\n    : null;\n  const threshold = target ? thresholdAtStandpointFrame(target, answer, here, w.marks ?? []) : null;\n  let bundledWalk = answer.walk;\n  if (threshold && answer.walk) {\n    const reach = standsWithin(here, threshold, { pointWithinMark: verbs.pointWithinMark });\n    if (!reach.stands) {\n      if (threshold !== target) bundledWalk = { ...answer.walk, to: { x: threshold.at.x, y: threshold.at.y } };\n'''
          if text.count(old) != 1:
              raise SystemExit(f"reach block start count: {text.count(old)}")
          text = text.replace(old, new, 1)

          old2 = '''      throw bounce(409, `you are not at that door — ${target.id} stands ~${reach.distance_round} m from where you stand`,\n        `a door is entered from within its reach (founder-ruled 2026-08-27; re-ruled 2026-09-11 to measure at the mark you NAMED, not the outermost link of its chain; R15 keeps walk and entry decoupled in both directions). Walk to (${target.at?.x}, ${target.at?.y}) and knock again; nothing was recorded`,\n        { walk: answer.walk });\n    }\n  }\n'''
          new2 = '''      throw bounce(409, `you are not at that door — ${threshold.id} stands ~${reach.distance_round} m from where you stand`,\n        `a door is entered from within its reach (founder-ruled 2026-08-27; re-ruled 2026-09-11 to measure at the mark you NAMED, not the outermost link of its chain; R15 keeps walk and entry decoupled in both directions). Walk to (${threshold.at?.x}, ${threshold.at?.y}) and knock again; nothing was recorded`,\n        { walk: bundledWalk });\n    }\n    // The engine's bundled walk was computed against canonical mark geometry.\n    // If the only mismatch was that this target rides our current frame, the\n    // live-frame reach above has already established that we stand at the door.\n    if (threshold !== target) bundledWalk = null;\n  }\n'''
          if text.count(old2) != 1:
              raise SystemExit(f"reach refusal count: {text.count(old2)}")
          text = text.replace(old2, new2, 1)

          old3 = '''    ...(answer.walk ? { walk_bundled: answer.walk } : {}),\n'''
          new3 = '''    ...(bundledWalk ? { walk_bundled: bundledWalk } : {}),\n'''
          if text.count(old3) != 1:
              raise SystemExit(f"walk_bundled count: {text.count(old3)}")
          text = text.replace(old3, new3, 1)

          path.write_text(text)
          PY

      - name: Verify focused #2712 tests are green
        run: node --test test/moving-child-threshold.test.mjs

      - name: Commit fix and falsifier
        shell: bash
        run: |
          git config user.name "Sophia Familiaris"
          git config user.email "sophia-familiaris@users.noreply.github.com"
          git add src/world-crossings.mjs test/moving-child-threshold.test.mjs
          git commit -m "fix(world): move nested thresholds with carrier frames"
          git push origin HEAD:${{ github.ref_name }}
