name: Verify #2712 moving child threshold

on:
  push:
    branches:
      - fix/2712-moving-child-threshold
    paths:
      - .github/workflows/patch-2712.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: office

      - uses: actions/checkout@v4
        with:
          repository: keeminlee/postmark-world
          ref: main
          path: postmark-world

      - name: Install dependencies
        working-directory: office
        run: npm install --no-audit --no-fund

      - name: Verify crossing and frame lanes
        working-directory: office
        run: |
          node --test \
            test/moving-child-threshold.test.mjs \
            test/world-crossings.test.mjs \
            test/world-movement.test.mjs \
            test/ring-wins-standpoint.test.mjs \
            test/hold-reach.test.mjs \
            test/reach-dial.test.mjs
