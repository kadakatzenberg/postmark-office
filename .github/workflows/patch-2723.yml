name: Patch #2723 draft path collision

on:
  push:
    branches:
      - fix/2723-draft-path-slug-collision
    paths:
      - .github/workflows/patch-2723.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Write #2723 regression
        shell: bash
        run: |
          cat > test/filing-slug-collision.test.mjs <<'EOF'
          // #2723 — an identity-shaped filing belongs only to its full id.
          // A different household using the same leaf slug is a new mark, not a
          // reference to the first household's published path.

          import test from "node:test";
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { mkdirSync, mkdtempSync, rmSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { tmpdir } from "node:os";
          import { filedPathOfAt, pathFor, resetPathIndex } from "../src/world-journal.mjs";

          function git(repo, ...args) {
            return execFileSync("git", ["-C", repo, ...args], { encoding: "utf8" }).trim();
          }

          function repoWith(...paths) {
            const repo = mkdtempSync(join(tmpdir(), "postmark-2723-"));
            git(repo, "init", "-q");
            git(repo, "config", "user.name", "fixture");
            git(repo, "config", "user.email", "fixture@example.invalid");
            for (const path of paths) {
              mkdirSync(join(repo, path, ".."), { recursive: true });
              writeFileSync(join(repo, path), "---\nkind: sited\n---\nfixture\n");
            }
            git(repo, "add", ".");
            git(repo, "commit", "-q", "-m", "fixture");
            return { repo, sha: git(repo, "rev-parse", "HEAD"), cleanup: () => rmSync(repo, { recursive: true, force: true }) };
          }

          test("#2723 — another household's identity-shaped mark is never a slug fallback", (t) => {
            const w = repoWith("WORLD/marks/vermillion/the-quiet-room/mark.md");
            t.after(w.cleanup);
            resetPathIndex();
            const filed = filedPathOfAt(w.repo, w.sha);

            assert.equal(filed("vermillion/the-quiet-room"), "WORLD/marks/vermillion/the-quiet-room/mark.md");
            assert.equal(filed("sophia-familiaris/the-quiet-room"), null,
              "a new full id with the same slug must not borrow Vermillion's filing");

            const own = pathFor({
              id: "sophia-familiaris/the-quiet-room",
              by: "sophia-familiaris",
              slug: "the-quiet-room",
              kind: "sited",
            }, { publishedPathOf: filed });
            assert.equal(own, "WORLD/marks/sophia-familiaris/the-quiet-room/mark.md");
          });

          test("#2723 — genuine non-identity legacy fossils still have the slug fallback", (t) => {
            const legacy = "WORLD/marks/old-geography/the-hill/inside/the-old-lamp/mark.md";
            const w = repoWith(legacy);
            t.after(w.cleanup);
            resetPathIndex();
            const filed = filedPathOfAt(w.repo, w.sha);
            assert.equal(filed("legacy-author/the-old-lamp"), legacy);
          });
          EOF

      - name: Confirm the regression is red
        shell: bash
        run: |
          set +e
          node --test test/filing-slug-collision.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Regression unexpectedly passed before the #2723 fix"
            exit 1
          fi
          echo "RED confirmed: identity-shaped path leaks through the legacy slug fallback"

      - name: Apply narrow filing-index fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/world-journal.mjs")
          text = path.read_text()
          old = '''      if (parts.length === 2) byId.set(`${parts[0]}/${parts[1]}`, path);  // filed at its id\n      bySlug.set(slug, bySlug.has(slug) ? null : path);                   // null = ambiguous\n'''
          new = '''      if (parts.length === 2) byId.set(`${parts[0]}/${parts[1]}`, path);  // filed at its id\n      else bySlug.set(slug, bySlug.has(slug) ? null : path);              // legacy only; null = ambiguous\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one filing-index block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify focused and filing tests
        shell: bash
        run: |
          node --test test/filing-slug-collision.test.mjs test/world-drain.test.mjs

      - name: Commit fix and falsifier
        shell: bash
        run: |
          git config user.name "Sophia Familiaris"
          git config user.email "sophia-familiaris@users.noreply.github.com"
          git add src/world-journal.mjs test/filing-slug-collision.test.mjs
          git commit -m "fix(world): scope legacy filing fallback to legacy paths"
          git push origin HEAD:${{ github.ref_name }}
