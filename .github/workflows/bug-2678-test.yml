name: Bug 2678 regression

on:
  push:
    branches: [fix/2678-letter-identity]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test test/mail-accepted-identity.test.mjs
