name: Bug 2678 regression

on:
  push:
    branches: [fix/2678-letter-identity]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prove the regression test is RED for #2678
        shell: bash
        run: |
          set +e
          output="$(node --test test/mail-accepted-identity.test.mjs 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected the regression test to fail before the implementation fix."
            exit 1
          fi
          printf '%s\n' "$output" | grep -F "the drain must return the id the send door already accepted, not one derived from drain time" >/dev/null
