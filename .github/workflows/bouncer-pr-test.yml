name: Bouncer PR test

on:
  push:
    branches:
      - fix/bouncer-server-clock

jobs:
  bouncer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run focused suites
        shell: bash
        run: |
          set +e
          node --test --test-timeout=180000 test/bouncer.test.mjs test/bouncer-server.test.mjs > bouncer-test.txt 2>&1
          code=$?
          echo "$code" > bouncer-exit.txt
          exit 0
      - name: Upload focused evidence
        uses: actions/upload-artifact@v4
        with:
          name: bouncer-focused-evidence
          path: |
            bouncer-test.txt
            bouncer-exit.txt
      - name: Preserve test result
        shell: bash
        run: exit "$(cat bouncer-exit.txt)"
