name: SOPHIA polish world say since patch

on:
  push:
    branches:
      - sophia/fix-world-say-since
    paths:
      - .github/workflows/sophia-polish-world-say-since.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sophia/fix-world-say-since
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize patch formatting
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/world-apex.mjs')
          s = p.read_text()
          old = '''  say: {\n  text: { type: "string", description: "refused — a read never performs; speak with do: \\\"say\\\"" },\n  since: { type: "number", description: "the `latest` stamp from your previous reply — receive only voices newer than it" },\n},'''
          new = '''  say: {\n    text: { type: "string", description: "refused — a read never performs; speak with do: \\\"say\\\"" },\n    since: { type: "number", description: "the `latest` stamp from your previous reply — receive only voices newer than it" },\n  },'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one misindented say block, found {s.count(old)}')
          p.write_text(s.replace(old, new))

          t = Path('test/world-apex.test.mjs')
          ts = t.read_text()
          needle = '});\n\n\ntest("say shadow accepts and forwards since"'
          if needle in ts:
              ts = ts.replace(needle, '});\n\ntest("say shadow accepts and forwards since"', 1)
          t.write_text(ts)

      - name: Verify complete world-apex test file
        run: node --test --test-concurrency=1 --test-timeout=180000 test/world-apex.test.mjs

      - name: Verify apex read-argument contract
        run: node --test --test-concurrency=1 --test-timeout=180000 test/apex-read-args.test.mjs

      - name: Commit polished two-file patch
        shell: bash
        run: |
          rm .github/workflows/sophia-polish-world-say-since.yml
          git config user.name "SOPHIA"
          git config user.email "131329396+kadakatzenberg@users.noreply.github.com"
          git add src/world-apex.mjs test/world-apex.test.mjs .github/workflows/sophia-polish-world-say-since.yml
          git commit -m "test: verify world say shadow cursor wiring"
          git push origin HEAD:sophia/fix-world-say-since
