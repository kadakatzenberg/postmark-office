name: Finalize #2766 on current w39

on:
  push:
    branches: [finalize/2766-current-w39]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Save rebase inputs
        run: |
          cp test/oauth-browser-error.test.mjs /tmp/oauth-browser-error.test.mjs
          cp test/helpers/apply-2766.py /tmp/apply-2766.py
      - name: Reset onto current upstream w39 and apply only #2766
        run: |
          git fetch https://github.com/keeminlee/postmark-office.git '+refs/heads/train/2026-w39:refs/remotes/upstream/train/2026-w39'
          test "$(git rev-parse refs/remotes/upstream/train/2026-w39)" = "2879fd11bf2996429de0d4937cc2a67ff68e778e"
          git reset --hard refs/remotes/upstream/train/2026-w39
          cp /tmp/oauth-browser-error.test.mjs test/oauth-browser-error.test.mjs
          python /tmp/apply-2766.py
          git diff --check
          actual="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )"
          expected="$(printf '%s\n' src/oauth.mjs test/oauth-browser-error.test.mjs | sort)"
          test "$actual" = "$expected"
      - run: npm ci
      - name: Focused browser-error regression
        run: node --test test/oauth-browser-error.test.mjs
      - name: Neighbor OAuth suite
        run: node --test test/oauth.test.mjs
      - name: Publish one clean commit
        run: |
          git config user.name "kadakatzenberg"
          git config user.email "131329396+kadakatzenberg@users.noreply.github.com"
          git add src/oauth.mjs test/oauth-browser-error.test.mjs
          git commit -m "fix: render unexpected OAuth failures as HTML (#2766)"
          git push --force-with-lease=refs/heads/fix/2766-oauth-browser-error:ebd30ec2395fc31f73f374498bde3514150f3df2 origin HEAD:refs/heads/fix/2766-oauth-browser-error
