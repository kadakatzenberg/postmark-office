name: Verify #2678 candidate neighbors

on:
  push:
    branches: [verify/2678-candidate-neighbors]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci

      - name: Apply candidate repair in worktree
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          write = Path('src/write.mjs')
          text = write.read_text()
          old_sig = 'export function validateLetter({ from, to, title, thread, body, stake_topic, stake_candidate, stake_stamps }, key, db) {'
          new_sig = 'export function validateLetter({ from, to, title, thread, body, stake_topic, stake_candidate, stake_stamps }, key, db, acceptedIdentity = null) {'
          assert text.count(old_sig) == 1
          text = text.replace(old_sig, new_sig, 1)
          old_identity = '''  const date = letterDate();
          const slug = slugify(title);
          const id = `${from}-${date}-to-${to}-${slug}`;
          if (db.prepare("SELECT 1 FROM letters WHERE id = ?").get(id))
            throw bounce(409, "a letter with this id already exists today", "change the title, or write tomorrow — one slug per correspondent per day");

          return { id, from, to, date, thread, slug, stakeFm, body };
        }'''
          new_identity = '''  const slug = slugify(title);
          const derivedDate = letterDate();
          let date = derivedDate;
          let id = `${from}-${date}-to-${to}-${slug}`;

          // A drain replay is not a new send. The town-log row already carries the
          // identity the send door accepted, and wall time may have crossed the
          // town's midnight before the ferry materialises it (#2678). Preserve that
          // accepted identity, but validate it against the envelope before using it
          // as a path so a journal row can never smuggle an arbitrary filename in.
          if (acceptedIdentity?.id || acceptedIdentity?.file) {
            const storedId = String(acceptedIdentity?.id ?? "");
            const storedFile = String(acceptedIdentity?.file ?? "");
            const prefix = `WHITE_PAGES/${from}/outbox/letter-`;
            const suffix = `-to-${to}-${slug}.md`;
            const candidateDate = storedFile.startsWith(prefix) && storedFile.endsWith(suffix)
              ? storedFile.slice(prefix.length, storedFile.length - suffix.length)
              : "";
            const expectedId = `${from}-${candidateDate}-to-${to}-${slug}`;
            if (!/^\d{4}-\d{2}-\d{2}$/.test(candidateDate)
                || storedId !== expectedId
                || storedFile !== outboxRelPath(from, candidateDate, to, slug)) {
              throw bounce(500, "stored letter identity is inconsistent with its accepted envelope",
                "the town-log row's id and file must name the same sender, date, recipient, and title slug; do not re-derive or guess a replacement identity");
            }
            date = candidateDate;
            id = storedId;
          }

          if (db.prepare("SELECT 1 FROM letters WHERE id = ?").get(id))
            throw bounce(409, "a letter with this id already exists today", "change the title, or write tomorrow — one slug per correspondent per day");

          return { id, from, to, date, thread, slug, stakeFm, body };
        }'''
          assert text.count(old_identity) == 1
          text = text.replace(old_identity, new_identity, 1)
          old_enqueue = '''export function enqueueLetter(args, key, db, clone) {
          const { id, from, to, date, thread, slug, stakeFm, body } = validateLetter(args, key, db);'''
          new_enqueue = '''export function enqueueLetter(args, key, db, clone, acceptedIdentity = null) {
          const { id, from, to, date, thread, slug, stakeFm, body } = validateLetter(args, key, db, acceptedIdentity);
          const relFile = acceptedIdentity?.file ?? outboxRelPath(from, date, to, slug);'''
          assert text.count(old_enqueue) == 1
          text = text.replace(old_enqueue, new_enqueue, 1)
          old_file = '  const file = join(clone, outboxRelPath(from, date, to, slug));'
          assert text.count(old_file) == 1
          text = text.replace(old_file, '  const file = join(clone, relFile);', 1)
          write.write_text(text)

          town = Path('src/town-mail.mjs')
          text = town.read_text()
          old_replay = '  return { row, result: door(row.payload?.args ?? {}, asKey, db, clone) };'
          new_replay = '''  const acceptedIdentity = row.payload?.id && row.payload?.file
            ? { id: row.payload.id, file: row.payload.file }
            : null;
          return { row, result: door(row.payload?.args ?? {}, asKey, db, clone, acceptedIdentity) };'''
          assert text.count(old_replay) == 1
          town.write_text(text.replace(old_replay, new_replay, 1))
          PY
          git diff --check

      - name: Focused regression
        run: node --test test/mail-accepted-identity.test.mjs

      - name: Neighbor suite town-mail
        run: node --test test/town-mail.test.mjs

      - name: Baseline guard town-bridge
        shell: bash
        run: |
          set +e
          output="$(node --test test/town-bridge.test.mjs 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F 'G:/postmark/seam-overnight/town-clone/tools/stamp-mint.mjs' >/dev/null
          printf '%s\n' "$output" | grep -E 'pass[[:space:]]+12' >/dev/null
          printf '%s\n' "$output" | grep -E 'fail[[:space:]]+6' >/dev/null

      - name: Neighbor suite foyer-shrink
        run: node --test test/foyer-shrink.test.mjs
