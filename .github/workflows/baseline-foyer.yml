name: baseline foyer probe

on:
  push:
    branches: ["fix/mcp-send-nonce-card"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: node --test --test-name-pattern="F7c5" test/foyer-shrink.test.mjs
