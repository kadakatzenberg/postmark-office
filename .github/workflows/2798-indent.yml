name: 2798 indentation cleanup

on:
  push:
    branches:
      - workbench/2798-indent

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: npm ci
      - name: Fetch current trains and target branch
        shell: bash
        run: |
          git fetch https://github.com/keeminlee/postmark-office.git '+refs/heads/train/*:refs/remotes/upstream/train/*'
          git fetch origin '+refs/heads/fix/2798-open-train-flip:refs/remotes/origin/fix/2798-open-train-flip'
      - name: Patch target commit only
        shell: bash
        run: |
          git checkout --detach refs/remotes/origin/fix/2798-open-train-flip
          python - <<'PY'
          from pathlib import Path
          p = Path('test/settlement-source-flip.test.mjs')
          s = p.read_text()
          old = '''\nassert.equal(ghostSweepPresent(store.commands, store.root), false,
  "the store-source chain must not run the rollback ghost sweep");

const fetches = store.commands.filter((c) => c.includes("fetch"));'''
          new = '''\n  assert.equal(ghostSweepPresent(store.commands, store.root), false,
    "the store-source chain must not run the rollback ghost sweep");

  const fetches = store.commands.filter((c) => c.includes("fetch"));'''
          if old not in s:
              raise SystemExit('indentation target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "test/settlement-source-flip.test.mjs"
      - name: Verify target test
        env:
          TRAIN_REF: upstream/train/2026-w39
        run: node --test test/settlement-source-flip.test.mjs
      - name: Amend clean PR commit
        shell: bash
        run: |
          git config user.name "kadakatzenberg"
          git config user.email "131329396+kadakatzenberg@users.noreply.github.com"
          git add test/settlement-source-flip.test.mjs
          git commit --amend --no-edit
          git push --force-with-lease=refs/heads/fix/2798-open-train-flip:1190c638b3a2762be763fafaab23bfc987198ab6 origin HEAD:refs/heads/fix/2798-open-train-flip
